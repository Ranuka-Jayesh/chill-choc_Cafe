<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Teal Rounded Shield -->
  <rect x="5" y="5" width="90" height="90" rx="28" fill="#1FB5AE" />
  <!-- Inner Warm Cream Badge -->
  <rect x="10" y="10" width="80" height="80" rx="22" fill="#FFFCF5" />
  
  <!-- Panda Ears -->
  <circle cx="34" cy="33" r="10" fill="#392A25" />
  <circle cx="34" cy="33" r="5" fill="#E99343" />
  <circle cx="66" cy="33" r="10" fill="#392A25" />
  <circle cx="66" cy="33" r="5" fill="#E99343" />
  
  <!-- Panda Head -->
  <circle cx="50" cy="50" r="26" fill="#FFFFFF" stroke="#E9E0D5" stroke-width="2" />
  
  <!-- Eye Patches (Cute Angled) -->
  <ellipse cx="38" cy="48" rx="8" ry="10" transform="rotate(-15 38 48)" fill="#392A25" />
  <ellipse cx="62" cy="48" rx="8" ry="10" transform="rotate(15 62 48)" fill="#392A25" />
  
  <!-- Sparkly Pupils -->
  <circle cx="39" cy="47" r="3.5" fill="#FFFFFF" />
  <circle cx="37" cy="49" r="1.5" fill="#1FB5AE" />
  <circle cx="61" cy="47" r="3.5" fill="#FFFFFF" />
  <circle cx="63" cy="49" r="1.5" fill="#1FB5AE" />
  
  <!-- Cute Pinkish Cheeks -->
  <circle cx="30" cy="56" r="4.5" fill="#F3B33D" opacity="0.6" />
  <circle cx="70" cy="56" r="4.5" fill="#F3B33D" opacity="0.6" />
  
  <!-- Nose & Smile -->
  <ellipse cx="50" cy="55" rx="3.5" ry="2.5" fill="#875136" />
  <path d="M46 58 Q50 63 54 58" stroke="#875136" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Chocolate Swirl Badge at bottom -->
  <circle cx="50" cy="74" r="8" fill="#F3B33D" />
  <path d="M46 74 C46 71, 54 71, 54 74 C54 77, 46 77, 50 75" stroke="#875136" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
